# Standalone server configuration; run from the project root with .env.deploy.
services:
  pii-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfa-pii/pii-service:server
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      PII_LISTEN_ADDR: ":8080"
      PII_READ_TIMEOUT: "10s"
      PII_WRITE_TIMEOUT: "10s"
      PII_IDLE_TIMEOUT: "60s"
      PII_SHUTDOWN_TIMEOUT: "10s"
      PII_MAX_BODY_BYTES: "2097152"
      PII_MAX_ACTIVE_REQUESTS: "200"
      PII_MAX_WORKING_BYTES: "67108864"
      PII_STORE_MAX_ENTRIES: "100000"
      PII_STORE_MAX_BYTES: "67108864"
      PII_STORE_MAX_RECORD_BYTES: "4194304"
      PII_STORE_TTL: "10m"
      PII_STORE_REPLAY_TTL: "2m"
      PII_STORE_CREATE_WAIT: "5s"
      PII_STORE_CLEANUP_INTERVAL: "1m"
      PII_MARKER_PREFIX: "PII"
      PII_CONSUMERS_FILE: "/etc/pii/consumers.local.json"
      PII_CONSUMER_DEMO_SECRET: "${PII_CONSUMER_DEMO_SECRET:?Set PII_CONSUMER_DEMO_SECRET in .env.deploy}"
    volumes:
      - type: bind
        source: ./config/consumers.local.json
        target: /etc/pii/consumers.local.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 20s
