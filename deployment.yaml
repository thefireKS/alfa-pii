apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-masker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pii-masker
  template:
    metadata:
      labels:
        app: pii-masker
    spec:
      containers:
        - name: api
          image: pii-masker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5